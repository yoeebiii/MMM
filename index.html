<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MMM</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Pretendard",
    "Noto Sans KR",
    sans-serif;
  background:#f7f6f2;
  color:#222;
}

#map{
  width:100%;
  height:100vh;
}

header{
  position:absolute;
  z-index:1000;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  padding:13px 23px;
  background:rgba(255,255,255,.94);
  border-radius:20px;
  box-shadow:0 5px 25px rgba(0,0,0,.12);
  text-align:center;
  pointer-events:none;
  backdrop-filter:blur(12px);
}

header h1{
  margin:0;
  font-size:21px;
  letter-spacing:3px;
  white-space:nowrap;
}

header p{
  margin:5px 0 0;
  color:#777;
  font-size:11px;
}

.my-location-button{
  position:absolute;
  z-index:1000;
  left:18px;
  bottom:25px;
  width:48px;
  height:48px;
  border:none;
  border-radius:50%;
  background:white;
  font-size:21px;
  cursor:pointer;
  box-shadow:0 5px 18px rgba(0,0,0,.2);
}

.add-button{
  position:absolute;
  z-index:1000;
  right:20px;
  bottom:25px;
  border:none;
  border-radius:50px;
  padding:14px 21px;
  background:#222;
  color:white;
  font-family:inherit;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
}

.location-selector{
  display:none;
  position:absolute;
  z-index:1500;
  inset:0;
  pointer-events:none;
}

.center-pin{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-100%);
  font-size:44px;
  pointer-events:none;
  filter:drop-shadow(0 4px 5px rgba(0,0,0,.35));
}

.location-guide{
  position:absolute;
  top:82px;
  left:50%;
  transform:translateX(-50%);
  padding:10px 16px;
  background:rgba(255,255,255,.95);
  border-radius:30px;
  font-size:12px;
  white-space:nowrap;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.current-position{
  position:absolute;
  left:50%;
  bottom:87px;
  transform:translateX(-50%);
  padding:8px 13px;
  background:rgba(255,255,255,.95);
  border-radius:20px;
  color:#777;
  font-size:10px;
  white-space:nowrap;
}

.confirm-location{
  position:absolute;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  pointer-events:auto;
  border:none;
  border-radius:50px;
  padding:14px 26px;
  background:#222;
  color:white;
  font-family:inherit;
  font-weight:700;
  cursor:pointer;
}

.modal-background{
  display:none;
  position:fixed;
  z-index:3000;
  inset:0;
  padding:18px;
  background:rgba(0,0,0,.45);
  align-items:center;
  justify-content:center;
}

.modal{
  width:min(480px,100%);
  max-height:92vh;
  overflow-y:auto;
  padding:24px;
  background:white;
  border-radius:23px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal h2{
  margin:0 0 20px;
  font-size:21px;
}

.selected-location{
  margin-bottom:17px;
  padding:12px;
  background:#f5f5f5;
  border-radius:12px;
  color:#666;
  font-size:11px;
}

.input-group{
  margin-bottom:16px;
}

.input-group label{
  display:block;
  margin-bottom:7px;
  color:#555;
  font-size:13px;
  font-weight:700;
}

input,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  font-family:inherit;
  font-size:14px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.notice{
  margin-top:7px;
  color:#999;
  font-size:10px;
  line-height:1.5;
}

.song-search-row{
  display:flex;
  gap:8px;
}

.song-search-row input{
  flex:1;
}

.song-search-button{
  border:none;
  border-radius:12px;
  padding:0 15px;
  background:#222;
  color:white;
  font-family:inherit;
  font-weight:700;
  cursor:pointer;
}

.song-results{
  display:none;
  margin-top:8px;
  max-height:220px;
  overflow-y:auto;
  border:1px solid #eee;
  border-radius:13px;
}

.song-result{
  display:flex;
  gap:10px;
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.song-result:hover{
  background:#f5f5f5;
}

.song-thumbnail{
  width:65px;
  height:45px;
  object-fit:cover;
  border-radius:7px;
}

.song-result-info{
  min-width:0;
}

.song-result-title{
  overflow:hidden;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.song-result-channel{
  margin-top:4px;
  color:#888;
  font-size:11px;
}

.selected-song{
  display:none;
  margin-top:9px;
  padding:12px;
  background:#f5f5f5;
  border-radius:12px;
}

.selected-song-title{
  font-size:13px;
  font-weight:700;
}

.selected-song-artist{
  margin-top:4px;
  color:#777;
  font-size:11px;
}

.change-song{
  margin-top:8px;
  border:none;
  padding:0;
  background:none;
  color:#777;
  font-family:inherit;
  font-size:11px;
  cursor:pointer;
}

.buttons{
  display:flex;
  gap:9px;
  margin-top:20px;
}

.buttons button{
  flex:1;
  border:none;
  border-radius:12px;
  padding:13px;
  font-family:inherit;
  font-weight:700;
  cursor:pointer;
}

.cancel{
  background:#eee;
}

.save{
  background:#222;
  color:white;
}

.save:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.memory-card{
  width:280px;
}

.memory-song{
  font-size:15px;
  font-weight:800;
}

.memory-artist{
  margin-top:4px;
  color:#777;
  font-size:11px;
}

.memory-memo{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #eee;
  font-size:13px;
  line-height:1.55;
  white-space:pre-wrap;
}

.memory-actions{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.like-button,
.comment-open-button{
  flex:1;
  border:none;
  border-radius:10px;
  padding:9px;
  background:#f1f1f1;
  cursor:pointer;
  font-family:inherit;
  font-weight:700;
}

.youtube-player{
  width:100%;
  aspect-ratio:16/9;
  margin-top:12px;
  border:0;
  border-radius:12px;
}

.comment-area{
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid #eee;
}

.comment-title{
  font-size:12px;
  font-weight:800;
  margin-bottom:8px;
}

.comment-list{
  max-height:150px;
  overflow-y:auto;
}

.comment-item{
  padding:8px 0;
  border-bottom:1px solid #eee;
  font-size:12px;
  line-height:1.45;
}

.comment-write{
  display:flex;
  gap:6px;
  margin-top:9px;
}

.comment-write input{
  min-width:0;
  padding:9px;
  font-size:12px;
}

.comment-write button{
  border:none;
  border-radius:9px;
  padding:0 11px;
  background:#222;
  color:white;
  font-family:inherit;
  font-weight:700;
}

.loading-message{
  position:absolute;
  z-index:2000;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  padding:9px 14px;
  background:white;
  border-radius:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
  font-size:11px;
}

@media(max-width:600px){

  header{
    top:10px;
    padding:10px 17px;
  }

  header h1{
    font-size:17px;
  }

  header p{
    font-size:10px;
  }

  .location-guide{
    top:70px;
  }

}

</style>
</head>

<body>

<header>
  <h1>MMM</h1>
  <p>MAP · MUSIC · MEMO</p>
</header>

<div id="map"></div>

<button
  class="my-location-button"
  id="myLocationButton"
>
  ◎
</button>

<button
  class="add-button"
  id="addButton"
>
  ＋ 장소 추가
</button>

<!-- 위치 선택 -->

<div
  class="location-selector"
  id="locationSelector"
>

  <div class="center-pin">
    📍
  </div>

  <div class="location-guide">
    지도를 움직여 📍 원하는 장소를 중앙에 맞춰주세요
  </div>

  <div
    class="current-position"
    id="currentPosition"
  >
    위치 확인 중...
  </div>

  <button
    class="confirm-location"
    id="confirmLocation"
  >
    이 위치 선택
  </button>

</div>

<!-- 기억 추가 -->

<div
  class="modal-background"
  id="modalBackground"
>

  <div class="modal">

    <h2>새로운 기억</h2>

    <div
      class="selected-location"
      id="selectedLocationInfo"
    >
      선택한 위치
    </div>

    <!-- 이름 -->

    <div class="input-group">

      <label>👤 이름</label>

      <input
        id="authorName"
        type="text"
        maxlength="30"
        placeholder="이름을 입력해주세요"
      >

      <div class="notice">
        이름은 관리자만 확인할 수 있으며 사이트에는 표시되지 않습니다.
      </div>

    </div>

    <!-- 노래 -->

    <div class="input-group">

      <label>🎵 노래</label>

      <div class="song-search-row">

        <input
          id="songSearch"
          type="text"
          placeholder="노래 제목이나 가수 검색"
        >

        <button
          class="song-search-button"
          id="songSearchButton"
        >
          검색
        </button>

      </div>

      <div
        class="song-results"
        id="songResults"
      ></div>

      <div
        class="selected-song"
        id="selectedSong"
      >

        <div
          class="selected-song-title"
          id="selectedSongTitle"
        ></div>

        <div
          class="selected-song-artist"
          id="selectedSongArtist"
        ></div>

        <button
          class="change-song"
          id="changeSong"
        >
          다른 노래 선택
        </button>

      </div>

    </div>

    <!-- 메모 -->

    <div class="input-group">

      <label>📝 메모</label>

      <textarea
        id="memo"
        maxlength="1000"
        placeholder="이 장소와 노래에 대한 기억을 적어보세요."
      ></textarea>

    </div>

    <div class="buttons">

      <button
        class="cancel"
        id="cancelButton"
      >
        취소
      </button>

      <button
        class="save"
        id="saveButton"
        disabled
      >
        기억 저장
      </button>

    </div>

  </div>

</div>

<div
  class="loading-message"
  id="loadingMessage"
>
  지도 불러오는 중...
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  serverTimestamp,
  doc,
  updateDoc,
  increment
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


/* =====================================================
   Firebase 설정
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyDeoX6FS2tEjcDvJ_5gi_jnKkdk4H0TJa4",

  authDomain:
    "map-of-music.firebaseapp.com",

  projectId:
    "map-of-music",

  storageBucket:
    "map-of-music.firebasestorage.app",

  messagingSenderId:
    "1013897221514",

  appId:
    "1:1013897221514:web:65274751a589b87897e473"

};


/* =====================================================
   YouTube API
===================================================== */

const YOUTUBE_API_KEY =
  "AIzaSyC6Uwp7MGQx9AGuXXDOnjTPtxnxtQzlKkk";


/* =====================================================
   Firebase
===================================================== */

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const auth =
  getAuth(app);

let currentUser =
  null;


/* =====================================================
   익명 로그인
===================================================== */

onAuthStateChanged(
  auth,
  user => {

    currentUser =
      user;

    document
      .getElementById("saveButton")
      .disabled =
      !user;

  }
);

signInAnonymously(auth)
  .catch(error => {

    console.error(
      "Firebase 인증 오류:",
      error
    );

  });


/* =====================================================
   지도
===================================================== */

const map =
  L.map("map");

L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);


/* 기본 위치 */

map.setView(
  [35.8714,128.6014],
  13
);


let selectedLocation =
  null;

let selectedSong =
  null;

let addingLocation =
  false;

let markers = {};

let myLocationMarker =
  null;


/* =====================================================
   현재 위치
===================================================== */

function getMyLocation(){

  if(!navigator.geolocation){

    alert(
      "이 브라우저에서는 위치 기능을 사용할 수 없습니다."
    );

    return;
  }

  navigator.geolocation.getCurrentPosition(

    position => {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;

      map.setView(
        [lat,lng],
        15
      );

      if(myLocationMarker){

        map.removeLayer(
          myLocationMarker
        );

      }

      myLocationMarker =
        L.circleMarker(
          [lat,lng],
          {
            radius:8,
            color:"#222",
            weight:3,
            fillColor:"#fff",
            fillOpacity:1
          }
        ).addTo(map);

      myLocationMarker.bindPopup(
        "📍 현재 내 위치"
      );

      document
        .getElementById("loadingMessage")
        .style.display =
        "none";

    },

    error => {

      console.log(
        "위치 오류:",
        error
      );

      document
        .getElementById("loadingMessage")
        .textContent =
        "위치 권한을 허용하면 현재 위치를 사용할 수 있어요.";

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:60000
    }

  );

}

getMyLocation();

document
  .getElementById("myLocationButton")
  .addEventListener(
    "click",
    getMyLocation
  );


/* =====================================================
   장소 추가
===================================================== */

document
  .getElementById("addButton")
  .addEventListener(
    "click",
    () => {

      addingLocation =
        true;

      document
        .getElementById("locationSelector")
        .style.display =
        "block";

      document
        .getElementById("addButton")
        .style.display =
        "none";

      updateCenterPosition();

      map.invalidateSize();

    }
  );


map.on(
  "move",
  () => {

    if(addingLocation){

      updateCenterPosition();

    }

  }
);


function updateCenterPosition(){

  const center =
    map.getCenter();

  document
    .getElementById("currentPosition")
    .textContent =
    `현재 위치 · ${center.lat.toFixed(5)}, ${center.lng.toFixed(5)}`;

}


/* =====================================================
   위치 선택
===================================================== */

document
  .getElementById("confirmLocation")
  .addEventListener(
    "click",
    () => {

      const center =
        map.getCenter();

      selectedLocation = {

        lat:center.lat,
        lng:center.lng

      };

      document
        .getElementById("selectedLocationInfo")
        .textContent =
        `📍 ${center.lat.toFixed(5)}, ${center.lng.toFixed(5)}`;

      addingLocation =
        false;

      document
        .getElementById("locationSelector")
        .style.display =
        "none";

      document
        .getElementById("addButton")
        .style.display =
        "block";

      document
        .getElementById("modalBackground")
        .style.display =
        "flex";

      map.invalidateSize();

    }
  );


/* =====================================================
   YouTube 검색
===================================================== */

document
  .getElementById("songSearchButton")
  .addEventListener(
    "click",
    searchSongs
  );

document
  .getElementById("songSearch")
  .addEventListener(
    "keydown",
    event => {

      if(event.key === "Enter"){

        searchSongs();

      }

    }
  );


async function searchSongs(){

  const queryText =
    document
      .getElementById("songSearch")
      .value
      .trim();

  if(!queryText){

    alert(
      "노래 제목이나 가수를 입력해주세요."
    );

    return;

  }

  if(
    !YOUTUBE_API_KEY ||
    YOUTUBE_API_KEY.includes("여기에_")
  ){

    alert(
      "YouTube API 키를 코드에 입력해주세요."
    );

    return;

  }

  const results =
    document.getElementById("songResults");

  results.style.display =
    "block";

  results.innerHTML =
    "<div style='padding:15px'>🎵 검색 중...</div>";

  try{

    const url =
      "https://www.googleapis.com/youtube/v3/search" +
      "?part=snippet" +
      "&type=video" +
      "&videoCategoryId=10" +
      "&maxResults=10" +
      "&regionCode=KR" +
      "&q=" +
      encodeURIComponent(queryText) +
      "&key=" +
      encodeURIComponent(YOUTUBE_API_KEY);

    const response =
      await fetch(url);

    const data =
      await response.json();

    if(!response.ok){

      console.error(data);

      results.innerHTML =
        "<div style='padding:15px'>YouTube 검색 오류가 발생했습니다.</div>";

      return;

    }

    results.innerHTML = "";

    if(
      !data.items ||
      data.items.length === 0
    ){

      results.innerHTML =
        "<div style='padding:15px'>검색 결과가 없습니다.</div>";

      return;

    }

    data.items.forEach(
      item => {

        if(
          !item.id ||
          !item.id.videoId
        ){
          return;
        }

        const videoId =
          item.id.videoId;

        const title =
          item.snippet.title;

        const channel =
          item.snippet.channelTitle;

        const thumbnail =
          item.snippet.thumbnails.medium.url;

        const div =
          document.createElement("div");

        div.className =
          "song-result";

        div.innerHTML = `

          <img
            class="song-thumbnail"
            src="${escapeAttribute(thumbnail)}"
          >

          <div class="song-result-info">

            <div class="song-result-title">
              ${escapeHTML(title)}
            </div>

            <div class="song-result-channel">
              ${escapeHTML(channel)}
            </div>

          </div>

        `;

        div.addEventListener(
          "click",
          () => {

            selectedSong = {

              title:title,

              artist:channel,

              videoId:videoId,

              youtube:
                "https://www.youtube.com/watch?v=" +
                videoId

            };

            document
              .getElementById("selectedSongTitle")
              .textContent =
              "🎵 " + title;

            document
              .getElementById("selectedSongArtist")
              .textContent =
              channel;

            document
              .getElementById("selectedSong")
              .style.display =
              "block";

            results.style.display =
              "none";

          }
        );

        results.appendChild(div);

      }
    );

  }
  catch(error){

    console.error(error);

    results.innerHTML =
      "<div style='padding:15px'>검색에 실패했습니다.</div>";

  }

}


/* =====================================================
   다른 노래
===================================================== */

document
  .getElementById("changeSong")
  .addEventListener(
    "click",
    () => {

      selectedSong =
        null;

      document
        .getElementById("selectedSong")
        .style.display =
        "none";

    }
  );


/* =====================================================
   기억 저장
===================================================== */

document
  .getElementById("saveButton")
  .addEventListener(
    "click",
    saveMemory
  );


async function saveMemory(){

  if(!currentUser){

    alert(
      "사용자 인증 중입니다. 잠시 후 다시 시도해주세요."
    );

    return;

  }

  const authorName =
    document
      .getElementById("authorName")
      .value
      .trim();

  const memo =
    document
      .getElementById("memo")
      .value
      .trim();

  if(!authorName){

    alert(
      "이름을 입력해주세요."
    );

    return;

  }

  if(!selectedLocation){

    alert(
      "위치를 선택해주세요."
    );

    return;

  }

  if(!selectedSong){

    alert(
      "노래를 선택해주세요."
    );

    return;

  }

  const button =
    document.getElementById("saveButton");

  button.disabled =
    true;

  button.textContent =
    "저장 중...";

  try{

    /*
     * 공개 정보
     *
     * 이름은 절대로 넣지 않음
     */

    const memoryRef =
      await addDoc(
        collection(db,"memories"),
        {

          lat:
            selectedLocation.lat,

          lng:
            selectedLocation.lng,

          song:
            selectedSong.title,

          artist:
            selectedSong.artist,

          videoId:
            selectedSong.videoId,

          youtube:
            selectedSong.youtube,

          memo:
            memo,

          likes:
            0,

          createdAt:
            serverTimestamp()

        }
      );


    /*
     * 비공개 정보
     *
     * 관리자만 읽을 수 있음
     */

    await addDoc(
      collection(db,"memoryPrivate"),
      {

        memoryId:
          memoryRef.id,

        authorName:
          authorName,

        createdAt:
          serverTimestamp()

      }
    );


    alert(
      "🎵 기억이 저장되었습니다!"
    );

    closeModal();

  }
  catch(error){

    console.error(
      "저장 오류:",
      error
    );

    alert(
      "저장에 실패했습니다.\n\n" +
      error.message
    );

  }
  finally{

    button.disabled =
      !currentUser;

    button.textContent =
      "기억 저장";

  }

}


/* =====================================================
   Firestore 실시간 데이터
===================================================== */

onSnapshotSafe();


function onSnapshotSafe(){

  import(
    "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js"
  )
  .then(
    firestore => {

      firestore.onSnapshot(

        firestore.collection(
          db,
          "memories"
        ),

        snapshot => {

          Object
            .values(markers)
            .forEach(
              marker => {

                map.removeLayer(
                  marker
                );

              }
            );

          markers = {};

          snapshot.forEach(
            item => {

              const memory =
                item.data();

              createMarker(
                item.id,
                memory
              );

            }
          );

          document
            .getElementById("loadingMessage")
            .style.display =
            "none";

        },

        error => {

          console.error(
            "Firestore 읽기 오류:",
            error
          );

          document
            .getElementById("loadingMessage")
            .textContent =
            "Firebase 연결 오류";

        }

      );

    }
  );

}


/* =====================================================
   마커
===================================================== */

function createMarker(
  id,
  memory
){

  const marker =
    L.marker([
      memory.lat,
      memory.lng
    ])
    .addTo(map);

  markers[id] =
    marker;

  marker.bindPopup(
    createPopupHTML(
      id,
      memory
    ),
    {
      maxWidth:320
    }
  );

}


/* =====================================================
   팝업
===================================================== */

function createPopupHTML(
  id,
  memory
){

  const video =
    memory.videoId
    ?

    `

      <iframe
        class="youtube-player"
        src="https://www.youtube.com/embed/${escapeAttribute(memory.videoId)}"
        title="YouTube player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>

    `

    :

    "";


  return `

    <div class="memory-card">

      <div class="memory-song">
        🎵 ${escapeHTML(
          memory.song || "노래 없음"
        )}
      </div>

      <div class="memory-artist">
        ${escapeHTML(
          memory.artist || ""
        )}
      </div>

      ${
        memory.memo
        ?

        `

          <div class="memory-memo">
            ${escapeHTML(memory.memo)}
          </div>

        `

        :

        ""
      }

      ${video}

      <div class="memory-actions">

        <button
          class="like-button"
          data-like-id="${escapeAttribute(id)}"
        >
          ❤️ ${memory.likes || 0}
        </button>

      </div>

      <div class="comment-area">

        <div class="comment-title">
          💬 댓글
        </div>

        <div
          class="comment-list"
          data-comment-list="${escapeAttribute(id)}"
        >
          불러오는 중...
        </div>

        <div class="comment-write">

          <input
            data-comment-name="${escapeAttribute(id)}"
            maxlength="30"
            placeholder="이름"
          >

          <input
            data-comment-text="${escapeAttribute(id)}"
            maxlength="300"
            placeholder="댓글"
          >

          <button
            data-comment-submit="${escapeAttribute(id)}"
          >
            등록
          </button>

        </div>

        <div class="notice">
          이름은 관리자만 확인할 수 있습니다.
        </div>

      </div>

    </div>

  `;

}


/* =====================================================

document.addEventListener(

map.on(
  "popupopen",
  event => {

    const popup =
      event.popup;

    const element =
      popup.getElement();

    if(!element){

    }

    const button =
      element.querySelector(
        "[data-comment-submit]"
      );

    if(!button){
      return;

    const memoryId =
      button.dataset.commentSubmit;

    loadComments(
      memoryId,
      element
    );

  }
);


async function loadComments(
  memoryId,
  popupElement
){

  const list =
    popupElement.querySelector(
      `[data-comment-list="${CSS.escape(memoryId)}"]`
    );

  if(!list){
    return;
  }

  try{

    const {
      getDocs,
      collection
    } =
    await import(
      "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js"
    );

    const snapshot =
      await getDocs(
        collection(
          db,
          "memories",
          memoryId,
          "comments"
        )
      );

    list.innerHTML = "";

    if(snapshot.empty){

      list.innerHTML =
        "<div style='color:#999'>아직 댓글이 없습니다.</div>";

      return;

    }

    snapshot.forEach(
      item => {

        const data =
          item.data();

        const div =
          document.createElement("div");

        div.className =
          "comment-item";

        div.textContent =
          data.text || "";

        list.appendChild(div);

      }
    );

  }
  catch(error){

    console.error(error);

    list.textContent =
      "댓글을 불러오지 못했습니다.";

  }

}

document.addEventListener(
  "click",

    const button =
      event.target.closest(
        "[data-comment-submit]"
      );

    if(!button){
      return;
    }

    if(!currentUser){

      alert(
        "사용자 인증 중입니다."
      );

      return;

    }

    const memoryId =
      button.dataset.commentSubmit;

    const popup =
      button.closest(".memory-card");

    const nameInput =
      popup.querySelector(
        `[data-comment-name="${CSS.escape(memoryId)}"]`
      );

    const textInput =
      popup.querySelector(
        `[data-comment-text="${CSS.escape(memoryId)}"]`
      );

    const name =
      nameInput.value.trim();

    const text =
      textInput.value.trim();

    if(!name){

      alert(
        "이름을 입력해주세요."
      );

      return;

    }

    if(!text){

      alert(
        "댓글을 입력해주세요."
      );

      return;

    }

    button.disabled =
      true;

    try{

      const {
        addDoc,
        collection,
        serverTimestamp
      } =
      await import(
        "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js"
      );


      /*
       * 공개 댓글
       * 이름 없음
       */

      const commentRef =
        await addDoc(
          collection(
            db,
            "memories",
            memoryId,
            "comments"
          ),
          {

            text:text,

            createdAt:
              serverTimestamp()

          }
        );


      /*
       * 관리자용 이름
       */

      await addDoc(
        collection(
          db,
          "commentPrivate"
        ),
        {

          memoryId:
            memoryId,

          commentId:
            commentRef.id,

          authorName:
            name,

          text:
            text,

          createdAt:
            serverTimestamp()

        }
      );


      textInput.value =
        "";

      await loadComments(
        memoryId,
        popup.closest(".leaflet-popup-content")
      );

    }
    catch(error){

      console.error(error);

      alert(
        "댓글 저장에 실패했습니다.\n\n" +
        error.message
      );

    }
    finally{

      button.disabled =
        false;

    }

  }
);

/* =====================================================
   HTML 안전 처리
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/"/g,"&quot;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");

}
